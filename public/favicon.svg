  <line x1="22" y1="6"  x2="22" y2="46" stroke="#16a34a" stroke-width="1.8" opacity="0.5"/>
  <line x1="32" y1="6"  x2="32" y2="46" stroke="#16a34a" stroke-width="1.8" opacity="0.5"/>
