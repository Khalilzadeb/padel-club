<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#16a34a"/>
  <!-- Racket head -->
  <ellipse cx="32" cy="26" rx="16" ry="18" fill="white" opacity="0.95"/>
  <!-- Racket strings horizontal -->
  <line x1="17" y1="20" x2="47" y2="20" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="26" x2="48" y2="26" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>
  <line x1="17" y1="32" x2="47" y2="32" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>
  <!-- Racket strings vertical -->
  <line x1="24" y1="9" x2="24" y2="44" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>
  <line x1="32" y1="8" x2="32" y2="44" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>
  <line x1="40" y1="9" x2="40" y2="44" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>
  <!-- Racket handle -->
  <rect x="28" y="43" width="8" height="13" rx="4" fill="white" opacity="0.9"/>
